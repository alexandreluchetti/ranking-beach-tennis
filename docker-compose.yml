services:
  postgres:
    image: postgres:17-alpine
    container_name: ranking-beach-tennis-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ranking}
      POSTGRES_USER: ${POSTGRES_USER:-ranking}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ranking}
      TZ: America/Sao_Paulo
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
